[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/ferrobot"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.release]
lto = "thin"

[package]
name = "ferrobot"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ferro-llsd = { path = "../llsd" }
ferro-msg = { path = "../msg" }
base64 = "0.23.1"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
glam = "0.34.1"
log = "0.4.34"
md5 = "0.8.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip"] }
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
ferro-testgrid = { path = "../testgrid" }
# paused time, so that the seed's retries take no real time in tests; processes, to run the bot
# against the test grid
tokio = { version = "1", features = ["test-util", "process", "io-util"] }

[lints]
workspace = true

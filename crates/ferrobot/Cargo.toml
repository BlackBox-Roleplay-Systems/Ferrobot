[package]
name = "ferrobot"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ferro-client = { path = "../client" }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
log = "0.4.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip"] }
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }

[dev-dependencies]
ferro-llsd = { path = "../llsd" }
ferro-testgrid = { path = "../testgrid" }
uuid = "1.27.0"
# processes, to run the bot against the test grid
tokio = { version = "1", features = ["process", "io-util"] }

[lints]
workspace = true

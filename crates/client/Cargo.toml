[package]
name = "ferro-client"
description = "A Second Life client as a library: login, the region circuit, capabilities, state and events"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ferro-llsd = { path = "../llsd" }
ferro-msg = { path = "../msg" }
base64 = "0.23.1"
glam = "0.34.1"
log = "0.4.34"
md5 = "0.8.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync"] }
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
ferro-testgrid = { path = "../testgrid" }
# paused time, so that the seed's retries take no real time in tests
tokio = { version = "1", features = ["test-util", "rt-multi-thread"] }

[lints]
workspace = true
